<nav class="nav" id="site-nav" aria-label="Main navigation">
  <button type="button" class="nav__toggle" id="nav-toggle" aria-expanded="false" aria-controls="nav-menu" aria-label="Toggle menu">
    <span class="nav__toggle-icon"><span></span><span></span><span></span></span>
  </button>
  <div class="nav__drawer" id="nav-drawer">
    <div class="nav__backdrop" id="nav-backdrop" aria-hidden="true"></div>
    <ul class="list list--nav" id="nav-menu">
    {% for item in site.navigation %}
      <li class="item  item--nav{% if item.url == page.url %}  item--current{% endif %}">
        {% if item.external %}
          <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.title }}</a>
        {% else %}
          <a href="{{ site.baseurl }}{{ item.url }}">{{ item.title }}</a>
        {% endif %}
      </li>
    {% endfor %}
  </ul>
  </div>
  <button class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Toggle dark mode" title="Toggle dark mode">
    <span class="theme-toggle__moon" aria-hidden="true">&#9790;</span>
    <span class="theme-toggle__sun" aria-hidden="true">&#9728;</span>
  </button>
  <a href="{{ site.baseurl }}/search/" class="search-icon-link" aria-label="Search posts" title="Search">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </a>
</nav>
