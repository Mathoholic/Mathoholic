---
layout: default
---

{% include site-header.html %}

<main class="main  container">

  <article class="article  article--post  content  typeset">

    <header class="post-header">
      <h1>{{ page.title }}</h1>
      {% include post-meta.html %}
      {% if page.author %}<p class="post-author">By <strong>{{ page.author }}</strong></p>{% endif %}
    </header>

    <div class="post-body">
      {{ content }}
    </div>

    {% include related-posts.html %}

    <p class="back-link"><a href="{{ site.baseurl }}/blog">&larr; Back to Blog</a></p>

  </article>

</main>

{% include site-footer.html %}
