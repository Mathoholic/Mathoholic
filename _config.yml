# 1. Files excluded from Jekyll builds
exclude:
  - README.md
  - CODE_OF_CONDUCT.md
  - CONTRIBUTING.md
  - screenshot.png
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - garth-jekyll-theme.gemspec

# 2. Installed Gems
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-feed
  - jekyll-sitemap

# 3. Gem settings
paginate: 5
paginate_path: "/blog/page:num/"

# 4. Jekyll settings
sass:
  style: compressed
  silence_deprecations:
    - import
permalink: pretty
excerpt_separator: <!-- more -->
timezone: Asia/Kolkata  # Change to your timezone

# 5. Collections
collections:
  posts:
    title: Blog
    output: true
    description: "Technical posts and tutorials on AI, Data Science & Backend Engineering"

# 6. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
      type: pages
    values:
      layout: page
  -
    scope:
      path: ""
      type: posts
    values:
      layout: post

# 8. Social handles (leave blank to hide)
social:
  facebook: "mathoholicbuilds"
  threads: "mathoholic.build.logs"
  linkedin: "mathoholic"
  instagram: "mathoholic.build.logs"

# Giscus comments — fill these in after installing the Giscus GitHub App
# Steps: https://giscus.app  →  pick your repo  →  enable Discussions  →  paste IDs below
giscus:
  repo: "Mathoholic/Mathoholic"
  repo_id: "R_kgDOMiFOzw"
  category: "Announcements"
  category_id: "DIC_kwDOMiFOz84C5AKG"
  mapping: "pathname"
  reactions_enabled: "1"
  emit_metadata: "0"
  theme_light: "light"
  theme_dark: "dark"

# 7. Site settings
encoding: utf-8
title: "Shantanu Sharma" 
logo: "/assets/logo.svg" 
description: "Data Scientist & Backend Engineer | AI, LLMs, ETL & Scalable Systems"
url: "https://mathoholic.com" 
baseurl: ""
lang: en-GB
google_analytics: "G-JFE55F7TTF"

